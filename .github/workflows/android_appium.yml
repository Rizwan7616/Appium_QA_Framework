name: Appium Android Mobile Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK and compile tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: appium-tests/pom.xml

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android-app
        # Run through bash so the build does not depend on the executable bit surviving git/zip.
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Compile Appium tests
        working-directory: appium-tests
        run: mvn -B -ntp test-compile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  e2e:
    name: Android emulator tests (API 34)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: appium-tests/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: demo-app-debug-apk
          path: android-app/app/build/outputs/apk/debug

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The action runs every line of `script` as a separate shell command,
          # so multi line logic lives in a real script file.
          script: bash scripts/run-appium-tests.sh
        env:
          PLATFORM_VERSION: '14'

      - name: Upload reports, screenshots and Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-test-reports
          path: |
            appium-tests/target/surefire-reports/
            appium-tests/target/screenshots/
            appium.log
          if-no-files-found: ignore
          retention-days: 14
